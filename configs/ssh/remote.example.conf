Host provtrust-gpu
    HostName REMOTE_HOST
    Port 22
    User REMOTE_USER
    IdentityFile C:/path/to/private/key
    IdentitiesOnly yes
    ServerAliveInterval 30
    ServerAliveCountMax 3

Host provtrust-gpu-tunnel
    HostName REMOTE_HOST
    Port 22
    User REMOTE_USER
    IdentityFile C:/path/to/private/key
    IdentitiesOnly yes
    ServerAliveInterval 30
    ServerAliveCountMax 3
    ExitOnForwardFailure yes
    LocalForward 18080 127.0.0.1:18080
    LocalForward 18081 127.0.0.1:18081
    LocalForward 17500 127.0.0.1:17500
