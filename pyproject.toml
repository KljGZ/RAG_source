[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "provenance-trust-bench"
version = "0.1.0"
description = "Provenance-grounded source discernment research infrastructure"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "ProvenanceTrustBench contributors" }]
dependencies = [
  "duckdb>=1.3",
  "fastapi>=0.116",
  "httpx>=0.28",
  "inspect-ai>=0.3.261,<0.4",
  "jinja2>=3.1",
  "jsonschema>=4.25",
  "networkx>=3.5",
  "numpy>=2.2",
  "orjson>=3.11",
  "pandas>=2.3",
  "polars>=1.32",
  "psutil>=7.0",
  "pyarrow>=21",
  "pydantic>=2.11,<3",
  "pyyaml>=6.0",
  "rich>=14",
  "scikit-learn>=1.7",
  "scipy>=1.16",
  "statsmodels>=0.14",
  "tenacity>=9.1",
  "typer>=0.16",
  "uvicorn>=0.35",
]

[project.optional-dependencies]
browser = [
  "beautifulsoup4>=4.13",
  "browsergym-core==0.14.3",
  "lxml>=5.3,<6",
  "playwright==1.44",
  "trafilatura==2.0.0",
]
evaluation = [
  "accelerate==1.14.0",
  "sentence-transformers==5.1.0",
  "transformers==4.56.2",
]
gpu = [
  "cuda-bindings==13.0.3; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "cuda-pathfinder==1.8.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "cuda-toolkit==13.0.2; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "nvidia-cublas==13.1.1.3; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "nvidia-cuda-cupti==13.0.85; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "nvidia-cuda-nvrtc==13.0.88; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "nvidia-cuda-runtime==13.0.96; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "nvidia-cudnn-cu13==9.20.0.48; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "nvidia-cufft==12.0.0.61; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "nvidia-cufile==1.15.1.6; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "nvidia-curand==10.4.0.35; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "nvidia-cusolver==12.0.4.66; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "nvidia-cusparse==12.6.3.3; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "nvidia-cusparselt-cu13==0.8.1; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "nvidia-nccl-cu13==2.29.7; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "nvidia-nvjitlink==13.0.88; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "nvidia-nvshmem-cu13==3.4.5; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "nvidia-nvtx==13.0.85; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "torch==2.12.1; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "triton==3.7.1; sys_platform == 'linux' and platform_machine == 'x86_64'",
]
bayes = [
  "arviz>=0.22",
  "bambi>=0.15",
  "pymc>=5.25",
]
dev = [
  "hypothesis>=6.138",
  "mypy>=1.17",
  "pre-commit>=4.3",
  "pytest>=8.4",
  "pytest-xdist>=3.8",
  "ruff>=0.12",
]

[project.scripts]
provtrust = "provtrust.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-config --strict-markers"
markers = [
  "integration: requires local services but no external model calls",
  "optional: requires an optional dependency layer",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["provtrust"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["networkx", "psutil", "yaml"]
ignore_missing_imports = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.coverage.run]
branch = true
source = ["provtrust"]

[tool.coverage.report]
show_missing = true
fail_under = 80
